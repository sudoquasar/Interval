name: Enrich data

# Nightly at 02:30 IST (PLAN.md §7.3). Scheduled runs are queued, not punctual, and GitHub
# disables schedules after 60 days without repository activity: run it by hand to revive it.

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      wanted:
        description: IMDb IDs to fetch first (space or comma separated)
        required: false
        default: ''

permissions:
  contents: write # needed to force-push the data branch

concurrency:
  group: enrich-data
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check out the data branch into ./data
        run: |
          mkdir -p data
          if git fetch --depth=1 origin data; then
            git archive FETCH_HEAD | tar -x -C data
          else
            echo "No data branch yet; starting from empty."
          fi

      - name: Build the catalogue from TMDB
        run: pnpm data:catalog
        env:
          DATA_DIR: data
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}

      - name: Fetch ratings from OMDb (hard cap 1,000 requests)
        # A rejected OMDb key fails this step visibly but still publishes tonight's catalogue.
        continue-on-error: true
        run: pnpm data:ratings
        env:
          DATA_DIR: data
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          WANTED_IDS: ${{ inputs.wanted }}

      - name: Publish the data branch as a single squashed commit
        working-directory: data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init --quiet --initial-branch=data
          git add --all
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet --message "Data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
